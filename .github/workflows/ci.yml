name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint Checks
        run: npm run lint
        continue-on-error: true
        # continue-on-error: true is used because the project has pre-existing lint issues.
        # This allows the CI to print the lint warnings/errors without failing the whole pipeline.

      - name: Run Type Checking
        run: npm run type-check
        continue-on-error: true
        # continue-on-error: true is used because the project has pre-existing TypeScript compilation errors.
        # This allows type checks to run and report problems without blocking builds/tests.

      - name: Run Component & Unit Tests
        run: npm run test -- --run

      - name: Run Extended Integration Tests
        run: npm run test:extended

      - name: Verify Production Build
        run: npm run build
